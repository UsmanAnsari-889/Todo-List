<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Works to do</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="icon" type="image/png" href="./Assests/todo-icon.png" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="top-boxes">
      <div class="box-1"></div>
      <div class="box-2"></div>
    </div>
    <div class="main-section">
      <div class="container">
        <div class="heading">
          <h1>My <span> ToDo</span> List</h1>
          <p>
            Made with<i class="fa-solid fa-heart"></i> By Usman Ahmed Ansari
          </p>
        </div>
        <div class="input-box">
          <input type="text" id="taskInput" placeholder="Enter your tasks..." />
          <button id="addBtn">+ Add Task</button>
        </div>
        <div class="review">
          <div class="total-tasks" id="totalTasks">
            <div class="icon-1"><i class="fa-solid fa-list"></i></div>
            <div class="text-1">
              <p>Total Tasks</p>
              <span>0</span>
            </div>
          </div>
          <div class="completed-tasks" id="completedTasks">
            <div class="icon-2"><i class="fa-solid fa-circle-check"></i></div>
            <div class="text-2">
              <p>Completed</p>
              <span>0</span>
            </div>
          </div>
        </div>

        <div class="task-lists">
          <ul id="taskLists"></ul>
        </div>
      </div>
    </div>
    <div class="bottom-boxes">
      <div class="box-a"></div>
      <div class="box-b"></div>
      <div class="box-c"></div>
    </div>
  </body>
  <script src="./app.js"></script>
</html>
